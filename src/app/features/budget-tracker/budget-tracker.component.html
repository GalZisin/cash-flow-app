<div class="budget-tracker-container">
  <!-- Header -->
  <div class="budget-header">
    <div class="header-top">
      <h1 class="page-title">
        <mat-icon>account_balance_wallet</mat-icon>
        מעקב תקציב
      </h1>
      
      <button mat-raised-button 
              [color]="isEditMode() ? 'primary' : ''" 
              (click)="toggleEditMode()">
        <mat-icon>{{ isEditMode() ? 'save' : 'edit' }}</mat-icon>
        {{ isEditMode() ? 'שמור הגדרות' : 'ערוך תקציב' }}
      </button>
    </div>

    <!-- Month Navigator -->
    <div class="month-navigator">
      <button mat-icon-button (click)="changeMonth('prev')">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <h2 class="current-month">{{ getMonthDisplay() }}</h2>
      <button mat-icon-button (click)="changeMonth('next')">
        <mat-icon>chevron_left</mat-icon>
      </button>
    </div>
  </div>

  <!-- Two Column Layout (Desktop) / Single Column (Mobile) -->
  <div class="content-layout">
    <!-- Left Column: Alerts, Summary, Progress -->
    <div class="left-column">
      <app-budget-summary [budget]="monthlyBudget()" [alerts]="alerts()" />
    </div>

    <!-- Right Column: Categories Grid (Scrollable) -->
    <div class="right-column">
      <form [formGroup]="budgetForm">
        <div class="categories-grid">
        @if (isEditMode()) {
          @for (config of categoryConfigs; track config.id) {
            <app-budget-category-card
              [config]="config"
              [budget]="categoryBudgetById().get(config.id) ?? null"
              [control]="limitControl(config.id)" />
          }
        } @else {
          @for (catBudget of sortedCategories(); track catBudget.category) {
            <app-budget-category-card [config]="categoryConfig(catBudget.category)" [budget]="catBudget" />
          }
        }
      </div>
      </form>
    </div>
  </div>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="loading-overlay">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
  }
</div>
